<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hứng Sao</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Game demo: di chuyển giỏ (chuột / chạm / phím ← →) để hứng sao, tránh bom.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const INK = '#1f1a33';
let W, H, scale;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min(W, H) / 500;
}
addEventListener('resize', resize);
resize();

const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ' || e.key === 'Enter') tap(); });
addEventListener('keyup', e => { keys[e.key] = false; });
const pointerX = e => (e.touches ? e.touches[0].clientX : e.clientX);
addEventListener('mousemove', e => { player.x = pointerX(e); });
addEventListener('touchmove', e => { player.x = pointerX(e); }, { passive: true });
addEventListener('mousedown', tap);
addEventListener('touchstart', e => { player.x = pointerX(e); tap(); }, { passive: true });

let state = 'menu', score = 0, best = 0, lives = 3, items = [], particles = [], spawnT = 0, time = 0;
const player = { x: W / 2 };

function tap() {
  if (state !== 'play') { state = 'play'; score = 0; lives = 3; items = []; particles = []; time = 0; }
}

function spawn() {
  const bomb = Math.random() < Math.min(0.15 + time / 120, 0.4);
  items.push({
    x: 30 + Math.random() * (W - 60), y: -30,
    vy: (140 + Math.random() * 80 + time * 4) * scale,
    rot: 0, vr: (Math.random() - 0.5) * 6, bomb,
  });
}

function burst(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
  }
}

function star(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r, a = (i * Math.PI) / 5 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = '#ffc93c'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
}

function bomb(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#3a3350'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + r * 0.5, y - r * 0.8); ctx.quadraticCurveTo(x + r, y - r * 1.5, x + r * 1.2, y - r * 1.2);
  ctx.stroke();
  ctx.fillStyle = Math.sin(time * 30) > 0 ? '#ff6b6b' : '#ffc93c';
  ctx.beginPath(); ctx.arc(x + r * 1.2, y - r * 1.2, r * 0.25, 0, Math.PI * 2); ctx.fill();
}

function basket(x, y, w) {
  const h = w * 0.45;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x + w * 0.38, y + h); ctx.lineTo(x - w * 0.38, y + h); ctx.closePath();
  ctx.fillStyle = '#ff6b6b'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - w * 0.42, y + h * 0.4); ctx.lineTo(x + w * 0.42, y + h * 0.4); ctx.stroke();
}

function text(str, x, y, size, color = '#fff') {
  ctx.font = `800 ${size}px "Trebuchet MS", sans-serif`;
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 6; ctx.strokeStyle = INK; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawBg() {
  ctx.fillStyle = '#8fd3ff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 260 + time * 20) % (W + 200)) - 100, cy = 60 + i * 70;
    ctx.beginPath(); ctx.arc(cx, cy, 26, 0, 7); ctx.arc(cx + 30, cy - 10, 32, 0, 7); ctx.arc(cx + 62, cy, 24, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#6bcb77'; ctx.fillRect(0, H - 40, W, 40);
  ctx.fillStyle = INK; ctx.fillRect(0, H - 40, W, 4);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  drawBg();

  const bw = 110 * scale, by = H - 40 - bw * 0.45;
  if (keys.ArrowLeft || keys.a) player.x -= 600 * scale * dt;
  if (keys.ArrowRight || keys.d) player.x += 600 * scale * dt;
  player.x = Math.max(bw / 2, Math.min(W - bw / 2, player.x));

  if (state === 'play') {
    time += dt; spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.3, 0.9 - time / 60); }
  }

  const r = 22 * scale;
  items = items.filter(it => {
    it.y += it.vy * dt; it.rot += it.vr * dt;
    if (state === 'play' && it.y > by - r && it.y < by + r && Math.abs(it.x - player.x) < bw / 2) {
      if (it.bomb) { lives--; burst(it.x, it.y, '#ff6b6b'); if (lives <= 0) { state = 'over'; best = Math.max(best, score); } }
      else { score++; burst(it.x, it.y, '#ffc93c'); }
      return false;
    }
    if (it.y > H + 40) return false;
    it.bomb ? bomb(it.x, it.y, r) : star(it.x, it.y, r * 1.2, it.rot);
    return true;
  });

  particles = particles.filter(p => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
    ctx.globalAlpha = Math.max(p.life / 0.6, 0); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 5 * scale, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    return p.life > 0;
  });

  basket(player.x, by, bw);

  const s = 28 * scale;
  ctx.textAlign = 'left';
  if (state === 'play') {
    text(`⭐ ${score}`, 70 * scale, 44 * scale, s, '#ffc93c');
    text('❤'.repeat(lives), W - 70 * scale, 44 * scale, s, '#ff6b6b');
  } else {
    ctx.fillStyle = 'rgba(31,26,51,0.35)'; ctx.fillRect(0, 0, W, H);
    if (state === 'menu') {
      text('HỨNG SAO', W / 2, H * 0.38, 64 * scale, '#ffc93c');
      text('Hứng ⭐ — né 💣', W / 2, H * 0.38 + 50 * scale, s);
    } else {
      text('GAME OVER', W / 2, H * 0.36, 60 * scale, '#ff6b6b');
      text(`Điểm: ${score}   Kỷ lục: ${best}`, W / 2, H * 0.36 + 50 * scale, s);
    }
    if (Math.sin(now / 250) > -0.3) text('Bấm để chơi', W / 2, H * 0.62, s * 1.1);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
